[project]
name = "jev-mcp-server"
version = "0.1.0"
description = "Faithful MCP server for Jev (TypeSafe System One): the three official question types — choice, score, noul — plus batch classify. Calibrated probabilities for coding agents."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "wangkuangkuang" }]
requires-python = ">=3.10"
keywords = [
  "mcp",
  "jev",
  "typesafe",
  "system-one",
  "model-context-protocol",
  "llm",
  "decision",
  "classifier",
  "routing",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "mcp>=1.9,<2",
  "httpx[http2]>=0.27",
]

[project.scripts]
jev-mcp-server = "jev_mcp_server.server:main"

[project.urls]
Homepage = "https://github.com/wangkuangkuang/jev-mcp-server"
Repository = "https://github.com/wangkuangkuang/jev-mcp-server"
Issues = "https://github.com/wangkuangkuang/jev-mcp-server/issues"
Changelog = "https://github.com/wangkuangkuang/jev-mcp-server/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_mcp_server"]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
